# Databricks App definition of the memory MCP server (app name must start with "mcp-", e.g. mcp-shs-memory).
# scripts/stage_memory_app.py puts the app's folder together with this file as its app.yaml (steps in INTEGRATION.md,
# "Deploying it"). Resources: the SQL warehouse under the key `sql-warehouse` (Can use), the model endpoint and the
# embedding endpoint (Can query).
command: ["python", "-m", "memory_demo.mcp_server"]
env:
  - name: BACKEND
    value: databricks
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Where the memory tables live: AskFST's catalog, in their own schema, never the demo's schema (a demo reset wipes
  # it). Fill in the catalog; the server refuses to start while it is empty.
  # Create the tables and grants with: scripts/setup_databricks.py --only-memory --catalog <catalog> --schema shs_memory
  - name: MEMORY_CATALOG
    value: ""
  - name: MEMORY_SCHEMA
    value: shs_memory
  # No DEMO_TODAY: the server works with the real date.
  # The server only reads the org directory: the HR / Entra sync fills it (for a pilot: scripts/pilot_admin.py people);
  # nothing here seeds or wipes it.
  - name: ORG_SEED
    value: "0"
  - name: MEMORY_DB_CONNECTIONS
    value: "4"
  # The model that decides what to remember after each answer.
  - name: LLM_PROVIDER
    value: databricks
  - name: DATABRICKS_LLM_ENDPOINT
    value: databricks-claude-sonnet-5-5
  # Mem0 finds terms by meaning (on by default). Its index lives in this app's temp folder and is rebuilt from the
  # tables; the match thresholds were set on this embedding model.
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: databricks-gte-large-en
  - name: EMBEDDING_DIMS
    value: "1024"
  # Service principals (application ids) that call for their users, comma-separated: the one AskFST's text-to-SQL
  # agent signs in as. Call the `health` tool as that principal to see the ids the platform reports for it.
  - name: MEMORY_TRUSTED_CALLERS
    value: ""
