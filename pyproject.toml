[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shs-memory"
version = "0.1.0"
description = "Shared memory layer for data assistants (AskFST): LangChain middleware and tools, in the agent's process"
readme = "INTEGRATION.md"
requires-python = ">=3.11"
# Installed from the wheel, set ORG_SEED=0: the seed/ folder (the demo's org chart) is not in the wheel.
dependencies = [
    "langchain>=1.4,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1.7,<2",
    "databricks-langchain>=0.22",
    "databricks-sdk>=0.160",
    "databricks-sql-connector>=4.8,<5",
    "databricks-sqlalchemy>=2",
    "mem0ai>=1,<2",
    "sqlglot>=25,<30",
    "python-dotenv",
]

[project.optional-dependencies]
demo = ["streamlit>=1.66,<2", "pandas", "pyarrow"]

[tool.setuptools]
packages = ["memory_demo"]
