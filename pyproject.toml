[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shs-memory"
version = "0.1.0"
description = "Shared memory layer for data assistants (AskFST): an MCP service, and LangChain middleware and tools that use it"
readme = "INTEGRATION.md"
requires-python = ">=3.11"
# The client: what an agent needs to use the memory MCP server (memory_demo.remote, .middleware, .api). It stays
# light on purpose: no Mem0, no SQL connectors, so the agent's own dependencies barely change.
dependencies = [
    "langchain>=1.4,<2",
    "httpx>=0.27",
    "databricks-sdk>=0.160",
]

[project.optional-dependencies]
# The memory service itself (python -m memory_demo.mcp_server, its own Databricks App). Run it from the source
# folder; with ORG_SEED=0 it needs nothing from seed/.
server = [
    "mcp>=1.30,<2",
    "uvicorn",
    "langchain-openai>=1.7,<2",
    "databricks-langchain>=0.22",
    "databricks-sql-connector>=4.8,<5",
    "mem0ai>=1,<2",
    "python-dotenv",
]
# The Streamlit demo: its SQL agent over the BGL table (SQLDatabase, the read-only guard) and the app.
demo = ["shs-memory[server]", "langchain-community>=0.4,<0.5", "databricks-sqlalchemy>=2", "sqlglot>=25,<30",
        "streamlit>=1.66,<2", "pandas", "pyarrow"]

[tool.setuptools]
packages = ["memory_demo"]
