# Databricks App definition. Resources are attached to the app (see README, "Deploy to Databricks"); the
# `valueFrom` names below must match their resource keys.
command: ["streamlit", "run", "app.py", "--server.headless", "true"]
env:
  - name: BACKEND
    value: databricks
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DEMO_CATALOG
    value: askar
  - name: DEMO_SCHEMA
    value: shs_memory_demo
  - name: DEMO_TODAY
    value: "2005-12-01"
  - name: LLM_PROVIDER
    value: databricks
  - name: DATABRICKS_LLM_ENDPOINT
    value: databricks-claude-sonnet-5-5
  - name: PERSONAL_MEMORY
    value: store
  # Embeddings for the "Find terms with Mem0" switch (off by default in the sidebar)
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: databricks-gte-large-en
  - name: EMBEDDING_DIMS
    value: "1024"
